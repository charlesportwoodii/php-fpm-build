---
kind: pipeline
type: docker
name: update-packages

platform:
  os: linux
  arch: amd64

# Only API-created builds run this pipeline.
#
# GitHub still delivers a tag webhook when the release workflow creates the
# tag - the GITHUB_TOKEN suppression applies to Actions workflow runs, not
# to outbound webhooks - and without this trigger Drone would start
# publishing before a single package had been uploaded. Builds created
# through the Drone API carry the `custom` event.
# See https://docs.drone.io/api/builds/build_create/
#
# Pipeline-level `trigger:` is normally unsafe in Drone, because a skipped
# pipeline leaves its dependents waiting forever
# (https://github.com/harness/drone/issues/2634, still open). It is safe
# here only because this config has one pipeline and no dependents. If a
# second pipeline is ever added, move this gate to step level.
trigger:
  event:
    - custom

volumes:
  - name: teleport-ssh
    host:
      path: /opt/teleport/erianna

steps:
  - name: update-apt-packages
    image: charlesportwoodii/drone-teleport:latest
    network_mode: host
    volumes:
      - name: teleport-ssh
        path: /opt/teleport/erianna
    settings:
      op: connect
      proxy: teleport.erianna.net
      hosts:
        - packages.teleport.erianna.net
      username: drone
      data_path: /opt/teleport/erianna
      script:
        commands:
          - /usr/local/bin/update-apt-packages
  - name: update-alpine-packages
    image: charlesportwoodii/drone-teleport:latest
    network_mode: host
    volumes:
      - name: teleport-ssh
        path: /opt/teleport/erianna
    settings:
      op: connect
      proxy: teleport.erianna.net
      hosts:
        - packages.teleport.erianna.net
      username: drone
      data_path: /opt/teleport/erianna
      script:
        commands:
          - /usr/local/bin/update-alpine-packages x86_64
          - /usr/local/bin/update-alpine-packages aarch64
